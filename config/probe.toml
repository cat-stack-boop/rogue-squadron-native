[input]
symbols_file_path = "probe-symbols.toml"
rom_file_path = "../roms/rogue_squadron.us.rev1.z64"
output_func_path = "../build/probe-generated"
uses_mips3_float_mode = false

[patches]
# Platform services supplied by the host. Original overlay selection, copy
# descriptors, and BSS clearing logic are recompiled unchanged.
ignored = ["rs_dma_read", "rs_invalidate_icache", "rs_invalidate_dcache", "rs_writeback_dcache_all"]

# N64 data-cache allocation is unnecessary for ordinary host RAM. The two
# original 64-bit stores and loop are retained. The input ROM is not modified.
[[patches.instruction]]
func = "rs_clear_memory"
vram = 0x8000041c
value = 0x00000000

# BLTZAL $zero + NOP captures PC+8 despite the branch never being taken.
# Materialize that original address explicitly so inline audio-table reads work.
[[patches.instruction]]
func = "rs_audio_feedback"
vram = 0x800919bc
value = 0x3c1f8009

[[patches.instruction]]
func = "rs_audio_feedback"
vram = 0x800919c0
value = 0x37ff19c4

[[patches.instruction]]
func = "rs_audio_cache_cursor"
vram = 0x80095040
value = 0
